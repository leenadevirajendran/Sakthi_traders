<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="introBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#introBg)"/>
  <rect x="20" y="20" width="600" height="440" rx="8" fill="#FFFFFF" stroke="#DFE4EC" stroke-width="2"/>
  <rect x="40" y="40" width="560" height="280" rx="6" fill="#102D65"/>
  <!-- Warehouse graphic representation -->
  <path d="M 60 280 L 180 160 L 300 280 L 420 160 L 580 280 Z" fill="#163D8F" fill-opacity="0.7"/>
  <text x="320" y="140" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-weight="800" font-size="22">CENTRAL SUPPLY INFRASTRUCTURE</text>
  <text x="320" y="170" text-anchor="middle" fill="#FFA3AB" font-family="Inter, sans-serif" font-weight="600" font-size="13">AMBATTUR INDUSTRIAL ESTATE, CHENNAI</text>
  <!-- Trust badges inside card -->
  <g transform="translate(60, 350)">
    <rect width="150" height="60" rx="4" fill="#F3F5F8" stroke="#DFE4EC"/>
    <text x="75" y="28" text-anchor="middle" fill="#102D65" font-family="Montserrat, sans-serif" font-weight="700" font-size="14">READY STOCK</text>
    <text x="75" y="46" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="10">Thousands of Tonnes</text>
  </g>
  <g transform="translate(245, 350)">
    <rect width="150" height="60" rx="4" fill="#F3F5F8" stroke="#DFE4EC"/>
    <text x="75" y="28" text-anchor="middle" fill="#102D65" font-family="Montserrat, sans-serif" font-weight="700" font-size="14">EXPRESS FLEET</text>
    <text x="75" y="46" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="10">Pan-India Dispatch</text>
  </g>
  <g transform="translate(430, 350)">
    <rect width="150" height="60" rx="4" fill="#F3F5F8" stroke="#DFE4EC"/>
    <text x="75" y="28" text-anchor="middle" fill="#102D65" font-family="Montserrat, sans-serif" font-weight="700" font-size="14">MTC COMPLIANCE</text>
    <text x="75" y="46" text-anchor="middle" fill="#718096" font-family="Inter, sans-serif" font-size="10">Batch Quality Assurance</text>
